task: "android_control_high"
test_split: test
dataset_path: xwm/AndroidControl
dataset_kwargs:
  token: True
output_type: generate_until
doc_to_visual: !function utils.android_control_doc_to_visual
doc_to_text: !function utils.android_control_doc_to_text_high
doc_to_target: "answer"
generation_kwargs:
  max_new_tokens: 32768
  temperature: 0.1
  do_sample: True
process_results: !function utils.android_control_process_result
lmms_eval_specific_kwargs:
  mimo_agent:
    model_name: "mimo_agent"
  uitars:
    model_name: "uitars"
  mimo_agent_multi:
    model_name: "mimo_agent_multi"
metric_list:
  - metric: action_type_acc
    aggregation: !function utils.android_control_aggregate_result
    higher_is_better: true
  - metric: step_wise_acc
    aggregation: !function utils.android_control_aggregate_result
    higher_is_better: true
  - metric: parse_error
    aggregation: !function utils.android_control_aggregate_result
    higher_is_better: false