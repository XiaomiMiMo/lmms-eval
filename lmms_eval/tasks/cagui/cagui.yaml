task: "cagui"
test_split: test
dataset_path: xwm/CAGUI
dataset_kwargs:
  token: True
output_type: generate_until
doc_to_visual: !function utils.cagui_doc_to_visual
doc_to_text: !function utils.cagui_doc_to_text
doc_to_target: "answer"
generation_kwargs:
  max_new_tokens: 1024
  temperature: 0.1
  do_sample: True
process_results: !function utils.cagui_process_result
lmms_eval_specific_kwargs:
  mimo_agent:
    model_name: "mimo_agent"
  uitars:
    model_name: "uitars"
  qwen25_vl:
    model_name: "qwen25_vl"
metric_list:
  - metric: action_type_acc
    aggregation: !function utils.cagui_aggregate_result
    higher_is_better: true
  - metric: step_wise_acc
    aggregation: !function utils.cagui_aggregate_result
    higher_is_better: true
  - metric: parse_error
    aggregation: !function utils.cagui_aggregate_result
    higher_is_better: false