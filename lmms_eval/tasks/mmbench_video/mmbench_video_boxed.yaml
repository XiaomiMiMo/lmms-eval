# Copyright 2025 Xiaomi Corporation.

dataset_path: lscpku/MMBench-Video
dataset_kwargs:
  token: True
  cache_dir: mmbench_video
  video: True
task: mmbench_video_boxed
test_split: test
output_type: generate_until
doc_to_visual: !function utils.mmbench_video_doc_to_visual
doc_to_text: !function utils.mmbench_video_doc_to_text
doc_to_target: "answer"
generation_kwargs:
  max_new_tokens: 32768
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
# The return value of process_results will be used by metrics
process_results: !function utils.mmbench_video_process_results
filter_list:
  - name: "flexible-extract"
    filter:
      - function: !function utils.BoxedFilter
metric_list:
  - metric: gpt_eval_score
    aggregation: !function utils.mmbench_video_aggregate_results
    higher_is_better: true
lmms_eval_specific_kwargs:
  default:
    post_prompt: "\nPut your final answer in \\boxed{}."
metadata:
  - version: 0.0
