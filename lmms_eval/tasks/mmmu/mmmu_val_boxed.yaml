# Copyright 2025 Xiaomi Corporation.

dataset_path: lmms-lab/MMMU
task: "mmmu_val_boxed"
test_split: validation
output_type: generate_until
doc_to_visual: !function utils.mmmu_doc_to_visual
doc_to_text: !function utils.mmmu_doc_to_text
doc_to_target: "answer"
# The return value of process_results will be used by metrics
process_results: !function utils.mmmu_process_results_boxed

metric_list:
  - metric: mmmu_acc
    aggregation: !function utils.mmmu_aggregate_results
    higher_is_better: true

lmms_eval_specific_kwargs:
  default:
    prompt_type: "format"
    multiple_choice_prompt: "Put your final answer in \\boxed{}."
    open_ended_prompt: "Put your final answer in \\boxed{}."

generation_kwargs:
  max_new_tokens: 32768
  temperature: 0.0
  do_sample: false

metadata:
  version: 0.0
  interleaved_format: false