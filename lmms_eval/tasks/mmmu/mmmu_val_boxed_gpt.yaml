dataset_path: lmms-lab/MMMU
task: "mmmu_val_boxed_gpt"
test_split: validation
output_type: generate_until
doc_to_visual: !function utils.mmmu_doc_to_visual
doc_to_text: !function utils.mmmu_doc_to_text
doc_to_target: "answer"
# The return value of process_results will be used by metrics
process_results: !function utils.mmmu_reasoning_process_results
filter_list:
  - name: "flexible-extract"
    filter:
      - function: !function utils.BoxedFilter

metric_list:
  - metric: mmmu_judge_acc
    aggregation: !function utils.mmmu_aggregate_judge_results
    higher_is_better: true

generation_kwargs:
  max_new_tokens: 32768
  temperature: 0
  do_sample: false

lmms_eval_specific_kwargs:
  default:
    prompt_type: "reasoning"
    multiple_choice_prompt: "Answer the question with option letter from given choices. Put your final answer within \\boxed{}."
    open_ended_prompt: "Put your final answer within \\boxed{}."

metadata:
  version: 0.0
  interleaved_format: false
