dataset_path: lscpku/vstar_bench
dataset_kwargs: {}
task: "vstar_bench_boxed"
test_split: test
output_type: generate_until
doc_to_visual: !function utils.vstar_bench_doc_to_visual
doc_to_text: !function utils.vstar_bench_doc_to_text
doc_to_target: "label"
generation_kwargs:
  max_new_tokens: 32768
  temperature: 0.0
  do_sample: false 
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nPut your final answer in \\boxed{}."
filter_list:
  - name: "flexible-extract"
    filter:
      - function: !function utils.BoxedFilter
process_results: !function utils.vstar_bench_process_results
metric_list:
  - metric: accuracy   
    aggregation: !function utils.vstar_bench_aggregate_results
    higher_is_better: true
metadata:
  - version: 0.0