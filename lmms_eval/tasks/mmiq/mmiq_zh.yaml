dataset_path: huanqia/MM-IQ
dataset_kwargs: {}
task: "mmiq_zh"
test_split: test  
output_type: generate_until
doc_to_visual: !function utils.mmiq_doc_to_visual
doc_to_text: !function utils.mmiq_zh_doc_to_text
doc_to_target: "answer"
generation_kwargs:
  max_new_tokens: 32 
  temperature: 0.0
  do_sample: false 
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\n请直接输出正确选项的字母，不要输出其他内容。"
process_results: !function utils.mmiq_process_results
metric_list:
  - metric: accuracy   
    aggregation: !function utils.mmiq_aggregate_results
    higher_is_better: true
metadata:
  - version: 0.0