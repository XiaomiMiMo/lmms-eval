# Copyright 2025 Xiaomi Corporation.

dataset_path: We-Math/We-Math
dataset_kwargs:
  token: True
task: "wemath_testmini_boxed"
test_split: testmini
output_type: generate_until
doc_to_visual: !function utils.wemath_doc_to_visual
doc_to_text: !function utils.wemath_boxed_doc_to_text
doc_to_target: "answer"
generation_kwargs:
  max_new_tokens: 32768
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
filter_list:
  - name: "flexible-extract"
    filter:
      - function: !function utils.BoxedFilter
process_results: !function utils.wemath_process_results
metric_list:
  - metric: wemath_standard_eval
    aggregation: !function utils.wemath_boxed_aggregate_results
    higher_is_better: True