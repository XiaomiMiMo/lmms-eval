task: "visualsimpleqa"
test_split: train
dataset_path: WYLing/VisualSimpleQA
dataset_kwargs:
  token: True
output_type: generate_until
doc_to_visual: !function utils.visualsimpleqa_doc_to_visual
doc_to_text: !function utils.visualsimpleqa_doc_to_text
doc_to_target: "answer"
generation_kwargs:
  max_new_tokens: 32
  temperature: 0
  do_sample: False
process_results: !function utils.visualsimpleqa_process_results
metric_list:
  - metric: accuracy
    aggregation: !function utils.visualsimpleqa_aggregate_results
    higher_is_better: true
lmms_eval_specific_kwargs:
  default:
    post_prompt: "\nAnswer the question using a single word or phrase."
