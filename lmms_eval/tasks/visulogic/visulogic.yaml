dataset_path: lscpku/VisuLogic
dataset_kwargs: {}
task: "visulogic"
test_split: test  
output_type: generate_until
doc_to_visual: !function utils.visulogic_doc_to_visual
doc_to_text: !function utils.visulogic_doc_to_text
doc_to_target: "label"
generation_kwargs:
  max_new_tokens: 32 
  temperature: 0.0
  do_sample: false 
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nAnswer directly with only the letter of the correct option and nothing else."
process_results: !function utils.visulogic_process_results
metric_list:
  - metric: accuracy   
    aggregation: !function utils.visulogic_aggregate_results
    higher_is_better: true
metadata:
  - version: 0.0