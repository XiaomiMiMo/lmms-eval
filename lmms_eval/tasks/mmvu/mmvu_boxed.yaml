# Copyright 2025 Xiaomi Corporation.

dataset_path: lscpku/MMVU
dataset_kwargs:
  token: True
  cache_dir: mmvu
  video: True
task: mmvu_boxed
test_split: test
output_type: generate_until
doc_to_visual: !function utils.mmvu_doc_to_visual
doc_to_text: !function utils.mmvu_doc_to_text
doc_to_target: "answer"
generation_kwargs:
  max_new_tokens: 32768
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
# The return value of process_results will be used by metrics
filter_list:
  - name: "flexible-extract"
    filter:
      - function: !function utils.BoxedFilter
process_results: !function utils.mmvu_process_results
metric_list:
  - metric: accuracy
    aggregation: !function utils.mmvu_aggregate_results
    higher_is_better: true
lmms_eval_specific_kwargs:
  default:
    post_prompt_mc: "\nAnswer with the option's letter from the given choices. Put your final answer within \\boxed{}."
    post_prompt_oe: "\nPut your final answer within \\boxed{}."
metadata:
  - version: 0.0
