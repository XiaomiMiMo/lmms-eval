dataset_path: tobiaslee/pixmo_count_eval
dataset_kwargs: {}
task: "pixmo_count_boxed_mimo"
test_split: train   
output_type: generate_until
doc_to_visual: !function utils.pixmo_count_doc_to_visual
doc_to_text: !function utils.pixmo_count_doc_to_text
doc_to_target: "answer"
generation_kwargs:
  max_new_tokens: 32768
  temperature: 0.0
  do_sample: false 
filter_list:
  - name: "flexible-extract"
    filter:
      - function: !function utils.BoxedFilter
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nPlease count the objects by grounding. Put your answer in \\boxed{}."
process_results: !function utils.pixmo_count_process_results
metric_list:
  - metric: accuracy   
    aggregation: !function utils.pixmo_count_aggregate_results
    higher_is_better: true
metadata:
  - version: 0.0
