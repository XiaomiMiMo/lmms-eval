dataset_path: lscpku/MMIFEval
dataset_kwargs:
  token: True
task: "mmifeval"
test_split: test
output_type: generate_until
doc_to_visual: !function utils.mmifeval_doc_to_visual
doc_to_text: !function utils.mmifeval_doc_to_text
doc_to_target: "answer"
generation_kwargs:
  max_new_tokens: 32768
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
process_results: !function utils.mmifeval_process_results
# filter_list:
#   - name: "flexible-extract"
#     filter:
#       - function: !function utils.BoxedFilter
metric_list:
  - metric: mmifeval_standard_eval
    aggregation: !function utils.mmifeval_aggregate_results
    higher_is_better: True
  - metric: mmifeval_c_level_eval
    aggregation: !function utils.mmifeval_aggregate_c_level_results
    higher_is_better: True
  - metric: mmifeval_p_level_eval
    aggregation: !function utils.mmifeval_aggregate_p_level_results
    higher_is_better: True
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: ""
