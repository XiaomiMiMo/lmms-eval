dataset_path: lscpku/LogicVista
dataset_kwargs:
  token: True
task: "logicvista_test"
test_split: test
output_type: generate_until
doc_to_visual: !function utils.logicvista_doc_to_visual
doc_to_text: !function utils.logicvista_doc_to_text
doc_to_target: "answer"
generation_kwargs:
  max_new_tokens: 32768
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
process_results: !function utils.logicvista_process_results
metric_list:
  - metric: logicvista_standard_eval
    aggregation: !function utils.logicvista_aggregate_results
    higher_is_better: True
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "Answer the question with option letter from given choices."