dataset_path: TIGER-Lab/Mantis-Eval
dataset_kwargs:
  token: True
task: "mantis"
test_split: test  
output_type: generate_until
doc_to_visual: !function utils.mantis_doc_to_visual
doc_to_text: !function utils.mantis_doc_to_text
doc_to_target: "answer"
generation_kwargs:
  max_new_tokens: 64 
  temperature: 0.0
  do_sample: false  
# The return value of process_results will be used by metrics
process_results: !function utils.mantis_process_results
metric_list:
  - metric: accuracy   
    aggregation: !function utils.mantis_aggregate_results
    higher_is_better: true
metadata:
  - version: 0.0