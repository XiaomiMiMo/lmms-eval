dataset_path: vikhyatk/CountBenchQA
dataset_kwargs: {}
task: "countbench"
test_split: test   
output_type: generate_until
doc_to_visual: !function utils.countbench_doc_to_visual
doc_to_text: !function utils.countbench_doc_to_text
doc_to_target: "answer"
generation_kwargs:
  max_new_tokens: 32 
  temperature: 0.0
  do_sample: false 
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nPlease give the answer in a single number."
process_results: !function utils.countbench_process_results
metric_list:
  - metric: accuracy   
    aggregation: !function utils.countbench_aggregate_results
    higher_is_better: true
metadata:
  - version: 0.0