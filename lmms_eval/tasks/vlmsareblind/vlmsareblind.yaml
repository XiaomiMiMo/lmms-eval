dataset_path: XAI/vlmsareblind
dataset_kwargs: {}
task: "vlmsareblind"
test_split: valid   
output_type: generate_until
doc_to_visual: !function utils.vlmsareblind_doc_to_visual
doc_to_text: !function utils.vlmsareblind_doc_to_text
doc_to_target: "answer"
generation_kwargs:
  max_new_tokens: 32 
  temperature: 0.0
  do_sample: false 
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nPlease give the answer directly."
process_results: !function utils.vlmsareblind_process_results
metric_list:
  - metric: accuracy
    aggregation: !function utils.vlmsareblind_aggregate_results
    higher_is_better: true
metadata:
  - version: 0.0